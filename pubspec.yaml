name: eannouncementhub
description: A college announcement hub app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ✅ Firebase
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.4
  firebase_auth: ^4.19.4
  firebase_messaging: ^14.9.2

  # ✅ Local storage
  shared_preferences: ^2.2.3

  # ✅ UI / Utility
  cached_network_image: ^3.3.1
  intl: ^0.19.0

  # ✅ HTTP (for emailing hooks later if needed)
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/bg.jpg
